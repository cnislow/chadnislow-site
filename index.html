<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- pins relative URLs (fetch(), the sun's background image, assets/resume.pdf) to
     the site root regardless of the current client-side route's pathname -->
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta property="og:type" content="website">
<meta property="og:title" content="Chad Nislow's Universe">
<meta property="og:description" content="A window into Chad Nislow's life, ideas, and experiences.">
<meta property="og:image" content="https://www.chadnislow.com/assets/chad-sun.jpg">
<meta property="og:url" content="https://www.chadnislow.com">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chad Nislow's Universe">
<meta name="twitter:description" content="A window into Chad Nislow's life, ideas, and experiences.">
<meta name="twitter:image" content="https://www.chadnislow.com/assets/chad-sun.jpg">
<title>Chad Nislow's Universe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --void:#1E2740;
  --panel:#232C42;
  --line:rgba(200,212,240,0.32);
  --brass:#D9AE68;
  --coral:#E4694A;
  --paper:#EDE9DC;
  --paper-dim:#AEB9DD;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:radial-gradient(120% 100% at 70% 20%, #2E3A5C, var(--void) 75%);overflow:hidden;font-family:'Inter',sans-serif;}

canvas#stars{position:fixed;inset:0;z-index:0;}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(600px 500px at 18% 24%, rgba(228,105,74,0.07), transparent 60%),
    radial-gradient(700px 600px at 82% 78%, rgba(90,120,200,0.08), transparent 60%),
    radial-gradient(500px 400px at 70% 15%, rgba(217,174,104,0.05), transparent 60%);
  animation:drift 80s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:scale(1.06) translate(1%,-1%);}}

.twinkle{position:fixed;border-radius:50%;background:#fff;z-index:0;pointer-events:none;}

#app{position:fixed;inset:0;z-index:1;}

#eyebrow{
  position:fixed;top:28px;left:32px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
  color:var(--paper-dim);text-transform:uppercase;z-index:5;
}
#tag{
  position:fixed;bottom:26px;right:32px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  color:rgba(135,144,160,0.6);z-index:5;
}
svg#orbits{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.ring{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:1 4;transition:opacity .5s ease, stroke .4s ease;}
.edge{stroke:rgba(217,174,104,0.55);stroke-width:1.2;stroke-dasharray:2 5;}

#graph{position:fixed;inset:0;z-index:2;}
.body{
  position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  cursor:pointer;transition:box-shadow .3s ease, opacity .5s ease, border-color .3s ease;
}
.sun{
  background:
    radial-gradient(circle at 35% 30%, rgba(244,223,168,0.4), rgba(156,122,59,0.15) 55%, rgba(0,0,0,0.4) 100%),
    url('assets/chad-sun.jpg');
  background-size:cover, cover;
  background-position:center, center 25%;
  background-blend-mode:overlay, normal;
  background-color:var(--brass);
  box-shadow:0 0 50px rgba(217,174,104,0.45), 0 0 120px rgba(217,174,104,0.15);
}
.sun-label{
  position:absolute;top:100%;left:50%;transform:translate(-50%,10px);
  font-family:'Fraunces',serif;font-weight:600;color:var(--paper);
  font-size:13px;white-space:nowrap;letter-spacing:.03em;text-align:center;
  pointer-events:none;
}
.planet{
  background:radial-gradient(circle at 32% 28%, #C7D2F5, #93A5E0 75%);
  border:1px solid rgba(70,90,160,0.55);
}
.planet-coral{background:radial-gradient(circle at 32% 28%, #F7B8A6, #EA8266 75%);border:1px solid rgba(160,70,50,0.55);}
.planet-mint{background:radial-gradient(circle at 32% 28%, #AEE0CB, #68B999 75%);border:1px solid rgba(40,100,75,0.55);}
.planet-periwinkle{background:radial-gradient(circle at 32% 28%, #C7D2F5, #93A5E0 75%);border:1px solid rgba(70,90,160,0.55);}
.planet-gold{background:radial-gradient(circle at 32% 28%, #F5DBA0, #E8B872 75%);border:1px solid rgba(150,105,40,0.55);}
.planet-lavender{background:radial-gradient(circle at 32% 28%, #DCC9F2, #B79AE0 75%);border:1px solid rgba(100,70,150,0.55);}
.planet:hover{box-shadow:0 0 26px rgba(217,174,104,0.35);}
.planet.active{border-color:var(--coral);box-shadow:0 0 40px rgba(228,105,74,0.45);}
.planet.dim{opacity:0.3;}
.planet-label{
  position:absolute;font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim);
  white-space:nowrap;pointer-events:none;transition:opacity .4s ease, color .3s ease;
  transform:translateX(-50%);
}
.planet-label.active{color:var(--brass);font-size:12px;}
.pulse{
  position:fixed;border-radius:50%;border:1.5px solid var(--coral);
  transform:translate(-50%,-50%);pointer-events:none;z-index:3;
  animation:pulseOut .8s ease-out forwards;
}
@keyframes pulseOut{
  0%{width:10px;height:10px;opacity:.9;}
  100%{width:140px;height:140px;opacity:0;}
}

#page{
  position:fixed;inset:0;z-index:20;
  background:rgba(20,26,42,0.98);
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .7s cubic-bezier(.22,.9,.3,1), transform .7s cubic-bezier(.22,.9,.3,1);
  overflow-y:auto;
}
#page.open{opacity:1;transform:translateY(0);pointer-events:auto;}
#pageChrome{
  position:sticky;top:0;z-index:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 40px;background:rgba(20,26,42,0.98);
  border-bottom:1px solid var(--line);
}
.page-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--brass);text-transform:uppercase;}
.page-close{
  background:none;border:none;cursor:pointer;color:var(--paper-dim);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;padding:6px 10px;
}
.page-close:hover{color:var(--paper);}
#pageLayout{display:flex;align-items:flex-start;justify-content:center;gap:40px;padding:0 24px;}
#pageNav{
  position:sticky;top:96px;flex:0 0 180px;
  display:flex;flex-direction:column;gap:2px;padding-top:48px;
}
.page-nav-link{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paper-dim);
  text-decoration:none;padding:8px 0 8px 12px;border-left:2px solid transparent;
  transition:color .2s ease, border-color .2s ease;
}
.page-nav-link:hover{color:var(--paper);}
.page-nav-link.active{color:var(--brass);border-left-color:var(--brass);}
#pageBody{
  flex:1 1 720px;max-width:720px;color:#b8bfce;
  padding:48px 0 80px;padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
#pageBody h2{font-family:'Fraunces',serif;font-weight:600;color:var(--paper);font-size:30px;margin:0 0 20px;}
#pageBody h3{font-family:'Fraunces',serif;font-weight:600;color:var(--paper);font-size:18px;margin:28px 0 10px;}
#pageBody p{line-height:1.7;font-size:15px;margin:0 0 14px;}
#pageBody a{color:var(--brass);}
#pageBody img{max-width:100%;border-radius:6px;margin:16px 0;}
#pageBody section + section{margin-top:48px;padding-top:48px;border-top:1px solid var(--line);}
/* keeps a heading from landing under the sticky #pageChrome bar when scrollIntoView jumps to it */
#pageBody section{scroll-margin-top:96px;}
.page-status{color:var(--paper-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;}

.timeline{list-style:none;margin:0;padding:0;}
.timeline li{display:grid;grid-template-columns:140px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line);}
.timeline li:first-child{border-top:none;padding-top:0;}
.timeline .when{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass);}
.timeline .what h3{margin-top:0;}
.timeline .org{color:var(--paper-dim);font-weight:400;font-size:14px;}

.pill-group{margin-bottom:24px;}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:8px 0 0;padding:0;}
.pills li{
  border:1px solid var(--line);padding:5px 12px;border-radius:999px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paper-dim);
}

@media (max-width:640px){
  #pageChrome{padding:20px 22px;}
  #pageLayout{flex-direction:column;gap:0;padding:0;}
  #pageNav{
    position:static;flex-direction:row;width:100%;flex:none;
    overflow-x:auto;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);
  }
  .page-nav-link{padding:4px 0;border-left:none;border-bottom:2px solid transparent;white-space:nowrap;}
  .page-nav-link.active{border-left-color:transparent;border-bottom-color:var(--brass);}
  #pageBody{max-width:none;padding:28px 22px 60px;padding-bottom:calc(60px + env(safe-area-inset-bottom));}
  #pageBody h2{font-size:24px;}
  .timeline li{grid-template-columns:1fr;gap:6px;}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>

<div id="app">
  <div id="eyebrow">Chad Nislow</div>
  <div id="tag">Chad Nislow - 2026 &copy;</div>
  <svg id="orbits"></svg>
  <div id="graph"></div>

  <div id="page" aria-hidden="true">
    <header id="pageChrome">
      <div class="page-eyebrow" id="pageEyebrow"></div>
      <button class="page-close" onclick="closePage()">✕ back</button>
    </header>
    <div id="pageLayout">
      <nav id="pageNav"></nav>
      <article id="pageBody"></article>
    </div>
  </div>
</div>

<script>
/* ---- placeholder "mass" + orbit values ----
   Later: orbitRadius / size / period should be derived from real
   signals (visits, recency, however "attention" gets defined).
   For now these are hand-set to demonstrate the feel. Periods are
   in seconds per full revolution — slow and ambient on purpose. */
const planets = [
  { id:'about', label:'About', size:40, orbit:220, period:260, angle0:0.4, hue:'periwinkle',
    blurb:'Who I am, beyond the résumé — the throughline connecting craft, travel, and work.',
    children:[
      { label:'Origin story', slug:'origin-story' },
      { label:'How I think', slug:'how-i-think' },
      { label:'Right now', slug:'right-now' },
    ] },
  { id:'professional', label:'Professional', size:52, orbit:340, period:340, angle0:2.6, hue:'coral',
    blurb:'Career history, skills, and a résumé — for anyone here to evaluate the work.',
    children:[
      { label:'Career timeline', slug:'career-timeline' },
      { label:'Skills', slug:'skills' },
      { label:'Résumé ↓', slug:'resume', href:'assets/resume.pdf' },
    ] },
  { id:'projects', label:'Projects', size:45, orbit:455, period:420, angle0:4.4, hue:'lavender',
    blurb:'A portfolio of things built and made — the craft in practice.',
    children:[
      { label:'Project One', slug:'project-one' },
      { label:'Project Two', slug:'project-two' },
      { label:'Project Three', slug:'project-three' },
    ] },
  { id:'travels', label:'Travels', size:54, orbit:565, period:500, angle0:1.1, hue:'mint',
    blurb:'Photos and notes from places I\u2019ve been — a visual travel log.',
    children:[
      { label:'Asia', slug:'asia' },
      { label:'Europe', slug:'europe' },
      { label:'Americas', slug:'americas' },
    ] },
  { id:'media', label:'Media', size:34, orbit:670, period:580, angle0:3.7, hue:'gold',
    blurb:'What I\u2019m consuming and recommending — books, film, shows, and favorites.',
    children:[
      { label:'Reading now', slug:'reading-now' },
      { label:'Recently watched', slug:'recently-watched' },
      { label:'All-time favorites', slug:'all-time-favorites' },
    ] },
];
const TILT = 0.52; // squashes circular orbits into a viewed-at-an-angle ellipse — kept mild so paths stay readable
const SUN_SIZE = 180; // 3x the original 60px
const PAUSE_ORBITS = false; // set true to freeze the whole system, not just while reading a page

const MIN_PLANET_PX = 38;    // touch-target floor
const MIN_FIT_SCALE = 0.18;  // safety floor for pathological viewports
const CHROME_MARGIN_H = 20;  // edge padding, "full" axis
const CHROME_MARGIN_V = 50;  // top/bottom room (eyebrow/tag)
const LABEL_ALLOWANCE = 28;  // extra room for label text past the farthest planet

let W,H,cx,cy;
let state = { expanded:false, activeId:null, t:0, paused:false };
let cam = { scale:1, focalX:0, focalY:0, px:0, py:0 };
let camTarget = { scale:1, focalX:0, focalY:0 };
// scale + orbit orientation, recomputed on every measure() so the whole
// system fits the viewport — portrait screens get a tall ellipse (tiltX<1),
// landscape/desktop get the original wide ellipse (tiltY<1)
let fit = { scale:1, tiltX:1, tiltY:TILT };

// persistent DOM references, built once (or rebuilt only when the
// expanded/active set changes) — never destroyed on every animation frame,
// so click handlers stay attached and reliable.
const dom = { planets:{}, rings:{}, labels:{}, activeEdge:null };

function measure(){ W=innerWidth; H=innerHeight; cx=W/2; cy=H/2; computeFit(); setCamTarget(); }

function computeFit(){
  const portrait = H > W;
  const tiltX = portrait ? TILT : 1;
  const tiltY = portrait ? 1 : TILT;

  // the planet with the largest true extent — orbit dominates size
  // differences, so this reduce is exact regardless of tilt
  const worst = planets.reduce((a,b)=> (b.orbit+b.size/2 > a.orbit+a.size/2) ? b : a);

  const availW = Math.max(0, W/2 - CHROME_MARGIN_H);
  const availH = Math.max(0, H/2 - CHROME_MARGIN_V);
  const reqX = worst.orbit*tiltX + worst.size/2;
  const reqY = worst.orbit*tiltY + worst.size/2 + LABEL_ALLOWANCE;

  const scale = Math.max(Math.min(availW/reqX, availH/reqY, 1), MIN_FIT_SCALE);
  fit = { scale, tiltX, tiltY };
}

function setCamTarget(){
  camTarget = state.expanded
    ? { scale:2.0, focalX:cx, focalY:cy }
    : { scale:1, focalX:cx, focalY:cy };
}

function effOrbit(p){ return p.orbit*fit.scale; }
function effSize(p, isActive){
  const raw = (isActive ? p.size*1.25 : p.size) * fit.scale;
  return Math.max(raw, MIN_PLANET_PX);
}
function effSunSize(){ return SUN_SIZE*fit.scale; }

function worldPos(p, t){
  const a = p.angle0 + (2*Math.PI/p.period)*t;
  const r = effOrbit(p);
  return { x: Math.cos(a)*r*fit.tiltX, y: Math.sin(a)*r*fit.tiltY };
}
function screenOf(wx,wy){
  return { x: cam.focalX + (wx-cam.px)*cam.scale, y: cam.focalY + (wy-cam.py)*cam.scale };
}

function drawStars(){
  const c = document.getElementById('stars');
  c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  for(let i=0;i<160;i++){
    const x = Math.random()*c.width, y = Math.random()*c.height;
    const r = Math.random()*1.1+0.2;
    ctx.globalAlpha = Math.random()*0.6+0.15;
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  document.querySelectorAll('.twinkle').forEach(n=>n.remove());
  for(let i=0;i<10;i++){
    const d = document.createElement('div');
    d.className='twinkle';
    const size = Math.random()*2+1.4;
    d.style.width=d.style.height=size+'px';
    d.style.left = Math.random()*innerWidth+'px';
    d.style.top = Math.random()*innerHeight+'px';
    d.style.animation = `pulseTwinkle ${3+Math.random()*4}s ease-in-out ${Math.random()*3}s infinite`;
    document.body.appendChild(d);
  }
}
const styleTag = document.createElement('style');
styleTag.textContent = `@keyframes pulseTwinkle{0%,100%{opacity:.15}50%{opacity:.9}}`;
document.head.appendChild(styleTag);

function mkEl(tag,cls){ const e=document.createElement(tag); e.className=cls; return e; }
function mkSvg(tag,cls){ const e=document.createElementNS('http://www.w3.org/2000/svg',tag); if(cls) e.setAttribute('class',cls); return e; }

function applyLabelScale(){
  const BASE_PLANET_FONT = 11, BASE_PLANET_FONT_ACTIVE = 12, BASE_SUN_FONT = 13;
  const MIN_FONT_FACTOR = 0.75; // never shrink labels below 75% of base size
  const f = Math.max(fit.scale, MIN_FONT_FACTOR);
  Object.values(dom.labels).forEach(l=>{
    l.style.fontSize = (l.classList.contains('active') ? BASE_PLANET_FONT_ACTIVE*f : BASE_PLANET_FONT*f)+'px';
  });
  const sl = dom.sun && dom.sun.querySelector('.sun-label');
  if(sl) sl.style.fontSize = (BASE_SUN_FONT*f)+'px';
}

function buildStatic(){
  const graph = document.getElementById('graph');
  const svg = document.getElementById('orbits');
  graph.innerHTML=''; svg.innerHTML='';
  dom.planets={}; dom.rings={}; dom.labels={};

  const sun = mkEl('div','body sun'); sun.style.width=sun.style.height=effSunSize()+'px';
  sun.onclick = ()=>{ if(state.expanded) navigateTo(null); };
  const sl = mkEl('div','sun-label'); sl.textContent='WELCOME';
  sun.appendChild(sl);
  graph.appendChild(sun);
  dom.sun = sun;

  planets.forEach(p=>{
    const ring = mkSvg('ellipse','ring');
    svg.appendChild(ring); dom.rings[p.id]=ring;

    const node = mkEl('div','body planet planet-'+p.hue);
    node.style.width = node.style.height = effSize(p,false)+'px';
    node.onclick = ()=> navigateTo(p.id);
    graph.appendChild(node); dom.planets[p.id]=node;

    const label = mkEl('div','planet-label');
    label.textContent = p.label;
    graph.appendChild(label); dom.labels[p.id]=label;
  });
}

function buildDynamic(){
  // toggles the active/dim visual state — happens rarely (on open/close), not every frame
  if(dom.activeEdge){ dom.activeEdge.remove(); dom.activeEdge=null; }
  const svg = document.getElementById('orbits');

  planets.forEach(p=>{
    const isActive = state.activeId===p.id;
    dom.planets[p.id].classList.toggle('active', isActive);
    dom.planets[p.id].classList.toggle('dim', state.expanded && !isActive);
    dom.labels[p.id].classList.toggle('active', isActive);
    dom.labels[p.id].style.opacity = (state.expanded && !isActive) ? '0' : '1';
    dom.rings[p.id].style.opacity = (state.expanded && !isActive) ? '0.12' : '0.55';
  });

  applyLabelScale();

  if(!state.expanded) return;

  dom.activeEdge = mkSvg('line','edge');
  svg.appendChild(dom.activeEdge);
}

function updateFrame(){
  const sunScreen = screenOf(0,0);
  dom.sun.style.left = sunScreen.x+'px'; dom.sun.style.top = sunScreen.y+'px';
  dom.sun.style.width = dom.sun.style.height = (effSunSize()*cam.scale)+'px';

  planets.forEach(p=>{
    const wp = worldPos(p, state.t);
    const sp = screenOf(wp.x, wp.y);
    const isActive = state.activeId===p.id;
    const size = effSize(p, isActive) * cam.scale;

    const node = dom.planets[p.id];
    node.style.left = sp.x+'px'; node.style.top = sp.y+'px';
    node.style.width = node.style.height = size+'px';

    const label = dom.labels[p.id];
    label.style.left = sp.x+'px';
    label.style.top = (sp.y + size/2 + 10)+'px';

    const ring = dom.rings[p.id];
    ring.setAttribute('cx', sunScreen.x); ring.setAttribute('cy', sunScreen.y);
    ring.setAttribute('rx', effOrbit(p)*fit.tiltX*cam.scale); ring.setAttribute('ry', effOrbit(p)*fit.tiltY*cam.scale);

    if(isActive && dom.activeEdge){
      dom.activeEdge.setAttribute('x1',sunScreen.x); dom.activeEdge.setAttribute('y1',sunScreen.y);
      dom.activeEdge.setAttribute('x2',sp.x); dom.activeEdge.setAttribute('y2',sp.y);
    }
  });
}

function spawnPulse(x,y){
  const p = document.createElement('div');
  p.className='pulse'; p.style.left=x+'px'; p.style.top=y+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),850);
}

function collapse(){
  hidePageOverlay();
  state.expanded=false; state.activeId=null;
  setCamTarget();
  buildDynamic();
}

function showPageOverlay(){
  document.getElementById('page').classList.add('open');
  document.getElementById('page').setAttribute('aria-hidden','false');
  document.getElementById('app').setAttribute('aria-hidden','true');
  state.paused = true;
}
function hidePageOverlay(){
  const pageEl = document.getElementById('page');
  pageEl.classList.remove('open');
  pageEl.setAttribute('aria-hidden','true');
  document.getElementById('app').removeAttribute('aria-hidden');
  state.paused = false;
}

function renderPageNav(p, activeSlug){
  const nav = document.getElementById('pageNav');
  nav.innerHTML = '';
  p.children.forEach(c=>{
    const a = document.createElement('a');
    a.className = 'page-nav-link' + (c.slug===activeSlug ? ' active' : '');
    a.textContent = c.label;
    if(c.href){
      a.href = c.href; a.target = '_blank'; a.rel = 'noopener';
    } else {
      a.href = pathFor(p.id, c.slug);
      a.onclick = (e)=>{ e.preventDefault(); navigateTo(p.id, c.slug); };
    }
    nav.appendChild(a);
  });
}

// resolver: a per-heading file wins if it exists, otherwise the whole-planet
// file is used — dropping in content/<planet>/<slug>.html later needs no code change
const pageCache = new Map();
async function fetchText(url){
  const res = await fetch(url, { cache:'no-store' });
  if(!res.ok) throw new Error('not found: '+url);
  const text = await res.text();
  // vercel.json's catch-all SPA rewrite can't exclude content/ by pattern
  // (Vercel's route matcher rejects lookahead regex), so a missing fragment
  // comes back as a 200 containing this whole document instead of a real
  // 404 — treat that the same as not-found so the resolver still falls
  // through instead of rendering the homepage inside the overlay
  if(/<!doctype html/i.test(text) || /<html[\s>]/i.test(text)) throw new Error('not found (app shell): '+url);
  return text;
}
async function loadFragment(planetId, slug){
  const wholeUrl = `content/${planetId}.html`;
  if(slug){
    const perHeadingUrl = `content/${planetId}/${slug}.html`;
    if(pageCache.has(perHeadingUrl)) return pageCache.get(perHeadingUrl);
    if(!pageCache.has(wholeUrl)){
      try {
        const html = await fetchText(perHeadingUrl);
        pageCache.set(perHeadingUrl, html);
        return html;
      } catch(e){ /* no per-heading file yet — fall through to the whole-planet file */ }
    }
  }
  if(pageCache.has(wholeUrl)) return pageCache.get(wholeUrl);
  const html = await fetchText(wholeUrl);
  pageCache.set(wholeUrl, html);
  return html;
}

// clicking a planet zooms the camera onto it and opens its reading overlay in one
// step — there's no separate "zoomed but browsing headings" screen anymore. A slug
// scrolls straight to that heading; without one the overlay opens at the top.
let pageRequestId = 0;
function openPlanet(id, slug){
  const p = planets.find(x=>x.id===id);
  if(!p){ navigateTo(null); return; }

  if(state.activeId !== id || !state.expanded){
    const wp = worldPos(p, state.t);
    const sp = screenOf(wp.x, wp.y);
    spawnPulse(sp.x, sp.y);
    state.expanded = true; state.activeId = id;
    setCamTarget();
    buildDynamic();
  }

  showPageOverlay();
  document.getElementById('pageEyebrow').textContent = p.label;
  renderPageNav(p, slug);

  const reqId = ++pageRequestId;
  const bodyEl = document.getElementById('pageBody');
  bodyEl.innerHTML = '<p class="page-status">Loading…</p>';
  loadFragment(id, slug).then(html => {
    if(reqId !== pageRequestId) return; // superseded by a newer navigation
    bodyEl.innerHTML = html;
    const heading = slug && document.getElementById(slug);
    if(heading){
      heading.setAttribute('tabindex','-1');
      heading.scrollIntoView({ block:'start' });
      heading.focus({ preventScroll:true });
    } else {
      bodyEl.scrollTop = 0;
    }
  }).catch(err => {
    if(reqId !== pageRequestId) return;
    bodyEl.innerHTML = '<p class="page-status">Couldn’t load this page. Try refreshing, or use ✕ back.</p>';
  });
}

function closePage(){
  if(!document.getElementById('page').classList.contains('open')) return;
  navigateTo(null);
}

function pathFor(planetId, slug){
  if(!planetId) return '/';
  return slug ? `/${planetId}/${slug}` : `/${planetId}`;
}
function navigateTo(planetId, slug){
  history.pushState(null, '', pathFor(planetId, slug));
  applyPath();
}
function applyPath(){
  const segments = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const [planetId, slug] = segments;
  const p = planets.find(x=>x.id===planetId);

  if(!p){
    if(location.pathname !== '/') history.replaceState(null,'','/');
    collapse();
    return;
  }
  const child = slug && p.children.find(c=>c.slug===slug && !c.href);
  if(slug && !child) history.replaceState(null,'',pathFor(p.id)); // unknown slug or a link-only child — normalize
  openPlanet(p.id, child ? slug : undefined);
}
addEventListener('popstate', applyPath);
addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && document.getElementById('page').classList.contains('open')) closePage();
});
window.closePage=closePage;

let last = performance.now();
function loop(now){
  const dt = (now-last)/1000; last = now;
  if(!state.paused && !PAUSE_ORBITS) state.t += dt;
  cam.scale += (camTarget.scale-cam.scale)*0.08;
  cam.focalX += (camTarget.focalX-cam.focalX)*0.08;
  cam.focalY += (camTarget.focalY-cam.focalY)*0.08;
  const targetP = state.expanded ? worldPos(planets.find(p=>p.id===state.activeId), state.t) : {x:0,y:0};
  cam.px += (targetP.x-cam.px)*0.07;
  cam.py += (targetP.y-cam.py)*0.07;
  updateFrame();
  requestAnimationFrame(loop);
}

function init(){
  measure(); drawStars();
  cam.px=0; cam.py=0; cam.focalX=cx; cam.focalY=cy;
  buildStatic(); buildDynamic();
  applyPath();
  requestAnimationFrame(loop);
}
addEventListener('resize', ()=>{ measure(); drawStars(); applyLabelScale(); });
init();
</script>
